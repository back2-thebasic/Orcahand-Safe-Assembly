[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-safety-v2"
version = "0.1.0"
description = "Independent experimental CBF-QP collision safety for OrcaHand v1"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
geometry = ["pin>=3.8", "cmeel-tinyxml2<11", "cmeel-urdfdom<5"]
safety = ["osqp>=1.0,<2", "scipy>=1.11"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
orca_safety_v2 = ["configs/*.yaml"]
[tool.pytest.ini_options]
pythonpath = ["src", "../orca_sim/src", "../orca_teleop/src"]
testpaths = ["tests"]
