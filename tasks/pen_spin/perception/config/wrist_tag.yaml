# The AprilTag (36h11) that fixes the camera -> palm transform.
#
# Tag frame: origin at the tag centre, +X right and +Y up as printed, +Z out of the face.
# Palm frame: robot/right_palm_link of the training scene.
#
# PLACEHOLDER: these are the simulation's right_wrist_tag site, on the back of the palm.
# With the palm up, as in training, that face points at the floor, so a camera that sees
# the pen does not see it. Mount the tag where the camera sees it, rigid with the palm,
# then put its measured pose here and set measured: true. A tag on the forearm or mount
# is only rigid with the palm at the wrist angle (--wrist-deg) it was measured at.
tag_id: 0
size_m: 0.0504           # black border edge
pos_in_palm: [0.0, -0.016, -0.01]
quat_in_palm: [0.70710678, 0.70710678, 0.0, 0.0]   # w x y z
measured: false
