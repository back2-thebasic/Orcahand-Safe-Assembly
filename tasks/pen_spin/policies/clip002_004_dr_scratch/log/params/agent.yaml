seed: 42
num_steps_per_env: 40
max_iterations: 10000
obs_groups:
  actor: !!python/tuple
  - policy
  critic: !!python/tuple
  - critic
save_interval: 500
experiment_name: orcahand_v1_pen_spin
run_name: PenSpin_OrcaHandV1_Continuous002004_DR
logger: tensorboard
wandb_project: ''
wandb_tags: !!python/tuple []
resume: false
load_run: .*
load_checkpoint: model_.*.pt
clip_actions: null
upload_model: true
class_name: OnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 1024
  - 512
  - 256
  activation: elu
  obs_normalization: true
  cnn_cfg: null
  distribution_cfg:
    class_name: wuji_mjlab.tasks.pen_spin.config.wuji_hand2.rsl_rl.distribution:SoftplusGaussianDistribution
    init_std: 0.5
    min_std: 0.2
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
critic:
  hidden_dims: !!python/tuple
  - 1024
  - 1024
  - 512
  - 256
  activation: elu
  obs_normalization: true
  cnn_cfg: null
  distribution_cfg: null
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
algorithm:
  num_learning_epochs: 4
  num_mini_batches: 32
  learning_rate: 0.0001
  schedule: fixed
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.001
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 0.5
  use_clipped_value_loss: false
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  share_cnn_encoders: false
  class_name: PPO
